```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - VeysAuction</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f5f7;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .register-box {
            width: 400px;
            max-width: 90%;

            background: white;
            padding: 35px;

            border-radius: 15px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin: 0 0 10px;
            color: #111827;
        }

        h2 {
            text-align: center;
            margin: 0 0 30px;
            color: #555;
            font-size: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;

            padding: 12px;

            margin-bottom: 20px;

            border: 1px solid #ddd;
            border-radius: 7px;

            font-size: 16px;

            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;

            padding: 12px;

            background: #2563eb;
            color: white;

            border: none;
            border-radius: 7px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: background 0.2s;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #555;
            text-decoration: none;

            transition: color 0.2s;
        }

        .back:hover {
            color: #2563eb;
        }
    </style>
</head>

<body>

    <div class="register-box">

        <h1>🚗 VeysAuction</h1>

        <h2>Create Account</h2>

        <form action="/register" method="post">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter username"
                required
                autocomplete="username"
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                required
                autocomplete="new-password"
            >

            <button type="submit">
                Register
            </button>

        </form>

        <a href="/" class="back">
            ← Back to VeysAuction
        </a>

    </div>

</body>

</html>
```
