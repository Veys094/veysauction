
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101828">

    <title>Create Account — VeysAuction</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --navy: #101828;
            --gold: #e9aa35;
            --background: #f5f6f8;
            --text: #172033;
            --muted: #788196;
            --border: #e5e8ee;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--background);
            color: var(--text);
            font-family: "DM Sans", Arial, sans-serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .topbar {
            background: var(--navy);
            color: white;
        }

        .navbar {
            max-width: 1260px;
            min-height: 76px;
            margin: auto;
            padding: 0 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            font-family: "Manrope", sans-serif;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -.7px;
        }

        .brand-icon {
            width: 39px;
            height: 39px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            background: var(--gold);
            color: var(--navy);
        }

        .brand-name span,
        .footer-brand span {
            color: var(--gold);
        }

        .nav-links {
            display: flex;
            gap: 26px;
        }

        .nav-links a {
            color: #c5ccda;
            font-size: 13px;
            font-weight: 600;
        }

        .nav-links a:hover {
            color: var(--gold);
        }

        main {
            flex: 1;
            display: grid;
            place-items: center;
            padding: 50px 20px;
            background:
                radial-gradient(
                    ellipse at 50% 0%,
                    rgba(233, 170, 53, .08),
                    transparent 55%
                ),
                var(--background);
        }

        .register-card {
            width: 100%;
            max-width: 440px;
            padding: 38px;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 12px 40px rgba(16, 24, 40, .06);
        }

        .eyebrow {
            color: #a9781c;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.8px;
            text-transform: uppercase;
        }

        h1 {
            margin: 12px 0 10px;
            font-family: "Manrope", sans-serif;
            font-size: 32px;
            line-height: 1.25;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .subtitle {
            margin: 0 0 28px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.7;
        }

        .form-group {
            margin-bottom: 21px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            color: #344054;
            font-size: 13px;
            font-weight: 700;
        }

        input {
            width: 100%;
            min-height: 49px;
            padding: 0 14px;
            border: 1px solid #d9dee7;
            border-radius: 9px;
            outline: none;
            background: white;
            color: var(--text);
            font: inherit;
            font-size: 14px;
            transition: border-color .2s, box-shadow .2s;
        }

        input::placeholder {
            color: #a0a8b6;
        }

        input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(233, 170, 53, .15);
        }

        .submit-button {
            width: 100%;
            min-height: 49px;
            margin-top: 5px;
            border: none;
            border-radius: 9px;
            background: var(--gold);
            color: var(--navy);
            cursor: pointer;
            font-size: 14px;
            font-weight: 800;
            transition: background .2s, transform .2s;
        }

        .submit-button:hover {
            background: #f4bd55;
            transform: translateY(-1px);
        }

        .login-prompt {
            margin: 24px 0 0;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
        }

        .login-prompt a {
            color: #9a6810;
            font-weight: 700;
        }

        .login-prompt a:hover {
            text-decoration: underline;
        }

        .notice {
            display: flex;
            gap: 10px;
            margin-top: 25px;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: #fafbfc;
            color: #667085;
            font-size: 11px;
            line-height: 1.7;
        }

        footer {
            background: var(--navy);
            color: white;
        }

        .footer-inner {
            max-width: 1260px;
            margin: auto;
            padding: 25px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .footer-brand {
            font-family: "Manrope", sans-serif;
            font-size: 17px;
            font-weight: 800;
        }

        .footer-note {
            margin-top: 6px;
            color: #98a2b3;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            .navbar {
                padding: 16px 20px;
                flex-wrap: wrap;
            }

            .nav-links {
                width: 100%;
                justify-content: space-between;
                gap: 12px;
                padding-top: 12px;
                border-top: 1px solid #303b4e;
            }

            .nav-links a {
                font-size: 12px;
            }

            .register-card {
                padding: 26px 22px;
            }

            h1 {
                font-size: 29px;
            }

            .footer-inner {
                padding: 22px 20px;
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header class="topbar">
    <nav class="navbar">
        <a href="/" class="brand">
            <span class="brand-icon">V</span>
            <span class="brand-name">Veys<span>Auction</span></span>
        </a>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/#cars">Browse Cars</a>
            <a href="/login">Login</a>
        </div>
    </nav>
</header>

<main>
    <section class="register-card">
        <div class="eyebrow">Join the auction</div>

        <h1>Create your account</h1>

        <p class="subtitle">
            Create an account to get started with VeysAuction.
        </p>

        <form action="/register" method="post">
            <div class="form-group">
                <label for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    required
                >
            </div>

            <button type="submit" class="submit-button">
                Create Account →
            </button>
        </form>

        <p class="login-prompt">
            Already have an account?
            <a href="/login">Sign in</a>
        </p>

        <div class="notice">
            <span>ⓘ</span>
            <div>
                <strong>Ready to get started?</strong><br>
                Complete both fields to create your account.
            </div>
        </div>
    </section>
</main>

<footer>
    <div class="footer-inner">
        <div>
            <div class="footer-brand">Veys<span>Auction</span></div>
            <div class="footer-note">
                Find your drive. Win your auction.
            </div>
        </div>

        <div class="footer-note">© 2026 VeysAuction</div>
    </div>
</footer>

</body>
</html>
