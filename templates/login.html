<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - VeysAuction</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f5f7;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .login-box {
            width: 400px;

            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;

            padding: 12px;

            margin-bottom: 20px;

            border: 1px solid #ddd;

            border-radius: 7px;

            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;

            padding: 12px;

            background: #2563eb;

            color: white;

            border: none;

            border-radius: 7px;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .register {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #2563eb;

            text-decoration: none;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 15px;

            color: #555;

            text-decoration: none;
        }

        /* BUG FOUND MESSAGE */

        .bug-message {
            margin-bottom: 25px;

            padding: 20px;

            background: #ecfdf5;

            border: 2px solid #16a34a;

            border-radius: 10px;

            color: #166534;

            line-height: 1.6;
        }

        .bug-message h3 {
            margin-top: 0;

            color: #15803d;

            text-align: center;
        }

        .bug-message p {
            margin: 8px 0 15px;
        }

    </style>

</head>


<body>


<div class="login-box">


    <h1>
        🚗 VeysAuction
    </h1>


    <h2>
        Login
    </h2>


    {% if error %}

    <div class="bug-message">

        <h3>
            🎉 Veys congratulates you!
        </h3>


        <strong>
            EN:
        </strong>

        <p>
            You found Bug #1!
            Login accepts an incorrect password.
        </p>


        <strong>
            AZ:
        </strong>

        <p>
            Siz Bug #1-i tapdınız!
            Login səhv parolu qəbul edir.
        </p>

    </div>

    {% endif %}


    <form
        action="/login"
        method="post"
    >

        <label>
            Username
        </label>

        <input
            type="text"
            name="username"
            placeholder="Enter username"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required
        >


        <button type="submit">
            Login
        </button>

    </form>


    <a
        href="/register"
        class="register"
    >
        Create an account
    </a>


    <a
        href="/"
        class="back"
    >
        ← Back to VeysAuction
    </a>


</div>


</body>

</html>
