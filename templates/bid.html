```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Place Bid - VeysAuction</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f5f7;
        }

        .container {
            width: 450px;
            max-width: 90%;
            margin: 70px auto;

            background: white;
            padding: 35px;

            border-radius: 15px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
        }

        h1 {
            margin-top: 0;
            text-align: center;
            color: #111827;
        }

        .car-name {
            font-size: 22px;
            font-weight: bold;
            margin: 20px 0 10px;
            color: #222;
        }

        .current-price {
            font-size: 20px;
            color: #16a34a;
            font-weight: bold;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;

            margin-bottom: 20px;

            border: 1px solid #ddd;
            border-radius: 7px;

            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;

            padding: 13px;

            background: #f59e0b;
            color: white;

            border: none;
            border-radius: 7px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: background 0.2s;
        }

        button:hover {
            background: #d97706;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #2563eb;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🔨 Make a Bid</h1>

        <div class="car-name">
            {{ car.brand }} {{ car.model }}
        </div>

        <div class="current-price">
            Current price: ${{ car.price }}
        </div>

        <form
            action="/cars/{{ car.id }}/bid"
            method="post"
        >

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                required
                autocomplete="username"
            >

            <label for="amount">
                Your Bid
            </label>

            <input
                type="number"
                id="amount"
                name="amount"
                placeholder="Enter bid amount"
                min="{{ car.price + 1 }}"
                step="0.01"
                required
            >

            <button type="submit">
                🔨 Place Bid
            </button>

        </form>

        <a
            href="/cars/{{ car.id }}/details"
            class="back"
        >
            ← Back to car
        </a>

    </div>

</body>

</html>
```
